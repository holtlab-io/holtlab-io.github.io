[package]
name = "holtlab-landing"
version = "0.1.0"
authors = ["Holt Lab <holtlab.io@gmail.com>"]
edition = "2024"
license = "MIT"

[dependencies]
dioxus = { version = "=0.7.9", features = ["router", "fullstack"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "Navigator", "Location", "Document", "Element", "History"] }
dioxus-cli-config = "0.7.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = "0.8.8"

[dev-dependencies]
syn = { version = "2.0", features = ["full", "visit"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }

[build-dependencies]
syn = { version = "2.0", features = ["full", "visit"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }

[lints.rust]
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server"]
