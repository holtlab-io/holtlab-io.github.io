[package]
name = "holtlab-landing"
version = "0.1.0"
authors = ["Holt Lab <contact@holtlab.io>"]
edition = "2024"
license = "MIT"

[dependencies]
dioxus = { version = "0.7.9", features = ["router", "web"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-sys = { version = "0.3", features = ["Window", "Storage", "Navigator", "Location"] }

[dev-dependencies]
syn = { version = "2.0", features = ["full", "visit"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }

[build-dependencies]
syn = { version = "2.0", features = ["full", "visit"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }

[lints.rust]
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[features]
default = ["web"]
web = ["dioxus/web"]
