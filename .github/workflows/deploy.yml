name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile Tailwind CSS
        run: |
          npm ci
          npx @tailwindcss/cli -i input.css -o assets/tailwind.css
          cp assets/tailwind.css public/assets/tailwind.css

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Dioxus CLI
        run: |
          curl -L https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          chmod +x dx
          mv dx /usr/local/bin/

      - name: Build Web with Dioxus
        run: |
          dx build --release --ssg

      - name: Prepare Pages Artifacts
        run: |
          mkdir -p dist
          cp -r target/dx/holtlab-landing/release/web/public/* dist/
          cp -r public/assets dist/ || true
          cp public/sitemap.xml dist/ || true
          cp public/robots.txt dist/ || true
          cp public/404.html dist/404.html || true
          touch dist/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
